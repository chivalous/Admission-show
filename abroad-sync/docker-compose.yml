services:
  app:
    build: .
    ports:
      - '3000:3000'
    env_file:
      - .env.production
    restart: always
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
